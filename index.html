<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0c0c0d" />
  <title>Gym · Tato & Gabi</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Barra superior de estado (conexión / cargas pendientes) -->
  <div id="statusBar" class="status-bar hidden"></div>

  <!-- ====================== LOGIN (mail + contraseña) ====================== -->
  <section id="screen-login" class="screen">
    <div class="auth-wrap">
      <h1 class="app-title">Entrenamiento</h1>
      <p class="app-sub">Iniciá sesión</p>
      <form id="login-form" class="auth-form">
        <label class="auth-label">Mail
          <input id="login-email" type="email" inputmode="email" autocomplete="username" required placeholder="tu@mail.com" />
        </label>
        <label class="auth-label">Contraseña
          <input id="login-pass" type="password" autocomplete="current-password" required placeholder="Tu contraseña" />
        </label>
        <div id="login-error" class="auth-error hidden"></div>
        <button type="submit" class="btn-primary" id="login-submit">Entrar</button>
      </form>
      <button class="auth-link" id="login-forgot" type="button">¿Olvidaste tu contraseña?</button>
    </div>
  </section>

  <!-- ====================== CREAR / CAMBIAR CONTRASEÑA ====================== -->
  <section id="screen-setpass" class="screen">
    <div class="auth-wrap">
      <h1 class="app-title">Tu contraseña</h1>
      <p class="app-sub" id="setpass-sub">Creá tu contraseña para entrar</p>
      <form id="setpass-form" class="auth-form">
        <label class="auth-label">Nueva contraseña
          <input id="setpass-p1" type="password" autocomplete="new-password" required minlength="6" placeholder="Mínimo 6 caracteres" />
        </label>
        <label class="auth-label">Repetir contraseña
          <input id="setpass-p2" type="password" autocomplete="new-password" required minlength="6" placeholder="Repetí la contraseña" />
        </label>
        <div id="setpass-error" class="auth-error hidden"></div>
        <button type="submit" class="btn-primary" id="setpass-submit">Guardar y entrar</button>
      </form>
    </div>
  </section>

  <!-- ====================== PANTALLA 1: ELEGIR USUARIO ====================== -->
  <section id="screen-user" class="screen active">
    <div class="user-picker">
      <h1 class="app-title">Entrenamiento</h1>
      <p class="app-sub">¿Quién sos?</p>
      <div class="user-buttons">
        <button class="btn-user" data-user="tato">Tato</button>
        <button class="btn-user" data-user="gabi">Gabi</button>
      </div>
    </div>
  </section>

  <!-- ====================== PANTALLA 2: MENÚ DE DÍAS ====================== -->
  <section id="screen-days" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-days-back" data-goto="user" aria-label="Cambiar usuario">‹</button>
      <div class="topbar-title">
        <span id="days-user-name">—</span>
      </div>
      <button class="icon-btn" id="btn-metrics" aria-label="Métricas" title="Métricas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 16v-5M13 16V9M18 16V7"/></svg>
      </button>
      <button class="icon-btn" id="btn-export" aria-label="Exportar respaldo" title="Exportar respaldo">⤓</button>
      <button class="icon-btn hidden" id="btn-logout" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </header>
    <div class="greeting">
      <div class="greeting-avatar" id="greeting-avatar">T</div>
      <div class="greeting-text">
        <div class="greeting-hi">Hola, <span id="greeting-name">—</span></div>
        <div class="greeting-sub">Elegí el día de hoy</div>
      </div>
    </div>
    <div class="days-list" id="days-list"></div>
  </section>

  <!-- ====================== PANTALLA 3: EJERCICIO ====================== -->
  <section id="screen-exercise" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-goto="days" aria-label="Volver a los días">‹</button>
      <div class="topbar-title">
        <span id="ex-day-name">—</span>
      </div>
      <div style="width:44px"></div>
    </header>

    <div class="exercise-viewport" id="exercise-viewport">
      <div class="exercise-track" id="exercise-track"><!-- tarjetas generadas por JS --></div>
    </div>

    <!-- Cambiar de persona (mismo día y mismo número de ejercicio) -->
    <div class="user-switch" id="user-switch"></div>

    <!-- Puntos de posición + flechas -->
    <nav class="pager">
      <button class="arrow" id="arrow-prev" aria-label="Ejercicio anterior">‹</button>
      <div class="dots" id="dots"></div>
      <button class="arrow" id="arrow-next" aria-label="Ejercicio siguiente">›</button>
    </nav>
  </section>

  <!-- ====================== PANTALLA 4: RESUMEN ====================== -->
  <section id="screen-summary" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-goto="days" aria-label="Volver a los días">‹</button>
      <div class="topbar-title">Resumen de la sesión</div>
      <div style="width:44px"></div>
    </header>
    <div class="summary" id="summary-content"></div>
    <div class="summary-actions">
      <button class="btn-primary" data-goto="days">Volver al menú</button>
    </div>
  </section>

  <!-- ====================== PANTALLA 5: MÉTRICAS ====================== -->
  <section id="screen-metrics" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-goto="days" aria-label="Volver a los días">‹</button>
      <div class="topbar-title">Métricas</div>
      <div style="width:44px"></div>
    </header>
    <div class="metrics-tabs" id="metrics-tabs">
      <button data-tab="general" class="on">General</button>
      <button data-tab="dia">Por día</button>
      <button data-tab="ejercicio">Por ejercicio</button>
    </div>
    <div class="metrics-body" id="metrics-body"></div>
  </section>

  <!-- Cartel emergente (toast) -->
  <div id="toast" class="toast hidden"></div>

  <!-- La app. type=module permite importar Supabase desde internet. -->
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
  <script>
    // Registrar el Service Worker (hace que la app funcione sin internet y sea instalable).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
